[project]
name = "youtube-summaries-backend"
version = "0.1.0"
description = "FastAPI wrapper around youtube-transcript-api"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "youtube-transcript-api>=1.0.0",
    "pydantic>=2.9.0",
    "google-genai>=1.0.0",
]

[tool.uv]
dev-dependencies = [
    "httpx>=0.27.0",
    "pytest>=8.3.0",
]
